[pytest]
# =========================
# General Configuration
# =========================

minversion = 7.0
testpaths = tests

# =========================
# Test Discovery
# =========================

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# =========================
# Output & Runtime Options
# =========================

addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# Prevent hanging tests
timeout = 300

# =========================
# Markers
# =========================

markers =
    unit: Unit tests for individual components
    integration: Integration tests for full pipelines
    slow: Tests that take longer to run
    gpu: Tests requiring GPU
    cpu: Tests for CPU-only execution
    dataset: Dataset loading and validation tests

    tier1: Tier 1 tests (Shape & Tensor Invariants)
    tier2: Tier 2 tests (Overfit-a-Batch)
    tier3: Tier 3 tests (Data Integrity & Leakage)
    tier4: Tier 4 tests (Gradient Flow)
    fst: FST module specific tests

# =========================
# Logging
# =========================

log_cli = false
log_cli_level = INFO

# =========================
# Doctest
# =========================

doctest_optionflags =
    NORMALIZE_WHITESPACE
    ELLIPSIS

# =========================
# Warnings
# =========================

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# =========================
# Coverage (optional)
# =========================
# Requires pytest-cov
# --cov=src --cov-report=html
