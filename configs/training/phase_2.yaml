# Phase 2 specific configuration (inherits from default)

defaults:
  - default

# Override defaults for phase 2
phase_1: false
phase_2: true
phase_1_ckpt_dir: ???
scr_ckpt_path: ???

# Loss weights for phase 2
sc_coefficient: 0.06
num_neg: 6
perceptual_coefficient: 0.06
offset_coefficient: 0.6

# Training steps for phase 2
max_train_steps: 2000
ckpt_interval: 500
log_interval: 50

# Learning rate for fine-tuning
learning_rate: 1e-5
lr_scheduler: "cosine"
lr_warmup_steps: 100
drop_prob: 0.1
mixed_precision: "no"