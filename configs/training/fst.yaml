# FontDiffuser FST (Few-Shot Transfer) Training Configuration
# Flat structure matching argparse arguments in src/configs/fontdiffuser.py

defaults:
  - default

# Experience & Logging
seed: 42
experience_name: "fontdiffuser_fst"
data_root: "my_dataset"
output_dir: "outputs/FontDiffuserFST"
report_to: "wandb"
logging_dir: "logs"

# Model Architecture
resolution: 96
unet_channels: [128, 128, 256, 256, 512, 512]
style_image_size: 96
content_image_size: 96
content_encoder_downsample_size: 3
channel_attn: true
content_start_channel: 64
style_start_channel: 64

# Training Phase Configuration (Phase 1 for FST)
phase_1: true
phase_2: false
phase_1_ckpt_dir: null

# SCR Module Configuration
temperature: 0.07
mode: "refinement"
scr_image_size: 96
scr_ckpt_path: null
num_neg: 16
nce_layers: "0,1,2,3"
sc_coefficient: 1.0

# Batch & Training Steps (Few-shot optimized)
train_batch_size: 4
max_train_steps: 50000
ckpt_interval: 2500
gradient_accumulation_steps: 2
log_interval: 50

# Loss Coefficients (Adjusted for FST)
perceptual_coefficient: 0.02
offset_coefficient: 0.5

# Learning Rate & Optimizer (Lower LR for fine-tuning)
learning_rate: 0.00005
scale_lr: false
lr_scheduler: "cosine"
lr_warmup_steps: 500
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 0.01
adam_epsilon: 1.0e-8
max_grad_norm: 1.0

# Classifier-Free Guidance
drop_prob: 0.1

# Scheduler
beta_scheduler: "scaled_linear"

# Sampling Configuration
algorithm_type: "dpmsolver++"
guidance_type: "classifier-free"
guidance_scale: 7.5
num_inference_steps: 20
model_type: "noise"
order: 2
skip_type: "time_uniform"
method: "multistep"
correcting_x0_fn: null
t_start: null
t_end: null

# Validation & Checkpointing
val_interval: 100

# Mixed Precision
mixed_precision: "fp16"

# Features (FST-specific)
enable_style_transform: true
controlnet: false
instructpix2pix: false

# Distributed Training
local_rank: -1

# FST-Specific Configuration
use_fst: true
fst_feature_channels: [64, 128, 256, 512, 1024]
fst_num_queries: 220
fst_query_dim: 128
fst_num_scales: 5
style_source_same_prob: 0.5
freeze_original_encoders: false